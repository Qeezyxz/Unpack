[package]
name = "unpack"
version = "1.1.1"
edition = "2021"

[lib]
name = "unpack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sha1 = "0.10.6"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }
url = "2"
socket2 = "0.6"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
iso2god = { path = "vendor/iso2god" }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
strip = true
lto = true
opt-level = "s"

[dev-dependencies]
tiny_http = "0.12"
crc32fast = "1"

[features]
default = []
download-test-loopback = []

[[example]]
name = "bridge"
required-features = ["download-test-loopback"]
