name: release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

concurrency:
  group: unpack-release-1-1-0
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.90.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm install

      - name: Build NSIS installer
        run: npx tauri build --bundles nsis

      - name: Pack portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = Join-Path (Get-Location) "src-tauri\target\release"
          $exe = @(
            (Join-Path $releaseDir "Unpack.exe"),
            (Join-Path $releaseDir "unpack.exe")
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "Unpack executable was not produced in $releaseDir" }
          $dll = Get-ChildItem -Path $releaseDir -Filter "WebView2Loader.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) { throw "WebView2Loader.dll was not produced under $releaseDir" }

          $portable = Join-Path (Get-Location) "portable"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item $exe (Join-Path $portable "Unpack.exe") -Force
          Copy-Item $dll.FullName (Join-Path $portable "WebView2Loader.dll") -Force

          $fetch = Join-Path (Get-Location) "7zip-fetch"
          New-Item -ItemType Directory -Force -Path $fetch | Out-Null
          Invoke-WebRequest -Uri "https://www.7-zip.org/a/7zr.exe" -OutFile (Join-Path $fetch "7zr.exe")
          Invoke-WebRequest -Uri "https://www.7-zip.org/a/7z2409-extra.7z" -OutFile (Join-Path $fetch "extra.7z")
          & (Join-Path $fetch "7zr.exe") x (Join-Path $fetch "extra.7z") "-o$fetch\out" -y
          Copy-Item (Join-Path $fetch "out\7za.exe") (Join-Path $portable "7za.exe") -Force
          $license = Join-Path $fetch "out\license.txt"
          if (Test-Path $license) {
            Copy-Item $license (Join-Path $portable "7-Zip-license.txt") -Force
          }

          if (Test-Path "Unpack-portable.zip") { Remove-Item "Unpack-portable.zip" -Force }
          Compress-Archive -Path (Join-Path $portable "*") -DestinationPath "Unpack-portable.zip"
          Get-ChildItem "src-tauri\target\release\bundle\nsis" | Format-Table Name, Length
          Get-Item "Unpack-portable.zip" | Format-List Name, Length

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Unpack 1.1.0
          target_commitish: 014cf01724cdc328cae6d95417dcddf474a97bfc
          body_path: .github/release-notes-1.1.0.md
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            Unpack-portable.zip
