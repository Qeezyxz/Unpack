name: release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

concurrency:
  group: unpack-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.90.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm install

      - name: Build NSIS installer
        run: npx tauri build --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: unpack-nsis
          if-no-files-found: error
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Pack portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $releaseDir = Join-Path (Get-Location) "src-tauri\target\release"
          Get-ChildItem (Join-Path $releaseDir "bundle\nsis") | Format-Table Name, Length
          $exe = @(
            (Join-Path $releaseDir "Unpack.exe"),
            (Join-Path $releaseDir "unpack.exe")
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "Unpack executable was not produced in $releaseDir" }
          $dll = Get-ChildItem -Path $releaseDir -Filter "WebView2Loader.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) { throw "WebView2Loader.dll was not produced under $releaseDir" }

          $portable = Join-Path (Get-Location) "portable"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item $exe (Join-Path $portable "Unpack.exe") -Force
          Copy-Item $dll.FullName (Join-Path $portable "WebView2Loader.dll") -Force

          $fetch = Join-Path (Get-Location) "7zip-fetch"
          New-Item -ItemType Directory -Force -Path $fetch | Out-Null
          $extraUrls = @(
            "https://github.com/ip7z/7zip/releases/download/26.05/7z2605-extra.7z",
            "https://github.com/ip7z/7zip/releases/download/25.01/7z2501-extra.7z",
            "https://www.7-zip.org/a/7z2501-extra.7z"
          )
          $zrUrls = @(
            "https://github.com/ip7z/7zip/releases/download/26.05/7zr.exe",
            "https://www.7-zip.org/a/7zr.exe"
          )
          $zr = Join-Path $fetch "7zr.exe"
          $gotZr = $false
          foreach ($url in $zrUrls) {
            try {
              Write-Host "Downloading $url"
              curl.exe -fsSL -L -o $zr $url
              $gotZr = $true
              break
            } catch {
              Write-Host "missed $url : $_"
            }
          }
          if (-not $gotZr) { throw "could not download 7zr.exe" }
          $extra = Join-Path $fetch "extra.7z"
          $got = $false
          foreach ($url in $extraUrls) {
            try {
              Write-Host "Downloading $url"
              curl.exe -fsSL -L -o $extra $url
              $got = $true
              break
            } catch {
              Write-Host "missed $url : $_"
            }
          }
          if (-not $got) { throw "could not download 7-Zip Extra" }
          $out = Join-Path $fetch "out"
          & $zr x $extra "-o$out" -y
          $seven = Get-ChildItem -Path $out -Filter "7za.exe" -Recurse | Select-Object -First 1
          if (-not $seven) { throw "7za.exe missing from Extra package" }
          Copy-Item $seven.FullName (Join-Path $portable "7za.exe") -Force
          $license = Get-ChildItem -Path $out -Filter "license.txt" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($license) {
            Copy-Item $license.FullName (Join-Path $portable "7-Zip-license.txt") -Force
          }

          if (Test-Path "Unpack-portable.zip") { Remove-Item "Unpack-portable.zip" -Force }
          Compress-Archive -Path (Join-Path $portable "*") -DestinationPath "Unpack-portable.zip"
          Get-Item "Unpack-portable.zip" | Format-List Name, Length

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: Unpack 1.4.0
          target_commitish: ${{ github.sha }}
          body_path: .github/release-notes-1.4.0.md
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            Unpack-portable.zip
