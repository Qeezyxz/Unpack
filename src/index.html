<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0c0f14" />
  <title>Unpack — ZIP · RAR · 7Z</title>
  <link href="./vendor/fonts/fonts.css" rel="stylesheet" />
  <link href="./app.css" rel="stylesheet" />
</head>
<body>
  <script src="./theme.js"></script>
  <div id="app"></div>
  <div class="alert hidden" id="job-error" role="alert" aria-live="assertive">
    <span class="alert-icon" aria-hidden="true">!</span>
    <div class="alert-body"><strong>Error</strong><p data-error-text></p><p class="meta" data-error-hint hidden></p></div>
    <div class="alert-actions">
      <button type="button" class="btn btn-secondary btn-sm" data-error-copy>Copy details</button>
      <button type="button" class="btn btn-secondary btn-sm" data-error-dismiss aria-label="Dismiss error">Dismiss</button>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
